<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pastel Love Hoodie | Velora</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#f7f3f0;
      font-family:'Poppins',sans-serif;
      color:#222;
    }

    nav{
      width:100%;
      height:75px;
      background:black;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 60px;
      position:fixed;
      top:0;
      z-index:1000;
    }

    .logo{
      color:white;
      font-size:38px;
      font-family:'Cormorant Garamond',serif;
      letter-spacing:2px;
    }

    .product-page{
      width:100%;
      min-height:100vh;
      padding:140px 80px 80px;
      display:flex;
      gap:70px;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
    }

    .product-image{
      flex:1;
      min-width:320px;
    }

    .product-image img{
      width:100%;
      max-width:550px;
      border-radius:25px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    .product-details{
      flex:1;
      min-width:320px;
    }

    .product-details h1{
      font-size:60px;
      line-height:65px;
      font-family:'Cormorant Garamond',serif;
      margin-bottom:20px;
    }

    .price{
      color:#d49a96;
      font-size:32px;
      font-weight:600;
      margin-bottom:25px;
    }

    .desc{
      color:gray;
      line-height:32px;
      margin-bottom:35px;
      max-width:500px;
    }

    .sizes{
      display:flex;
      gap:15px;
      margin-bottom:35px;
      flex-wrap:wrap;
    }

    .size-btn{
      width:60px;
      height:60px;
      border-radius:12px;
      border:none;
      background:white;
      cursor:pointer;
      font-weight:600;
      transition:.3s;
      box-shadow:0 5px 15px rgba(0,0,0,.05);
    }

    .size-btn:hover{
      background:black;
      color:white;
    }

    .add-cart{

      padding:18px 45px;
      border:none;
      background:black;
      color:white;
      border-radius:12px;
      cursor:pointer;
      font-size:16px;
      transition:.3s;

    }

    .add-cart:hover{
      background:#d49a96;
    }

    .recommend-section{
      width:100%;
      padding:0 80px 80px;
    }

    .recommend-section h2{
      font-size:42px;
      font-family:'Cormorant Garamond',serif;
      margin-bottom:30px;
    }

    .recommend-products{
      display:flex;
      gap:25px;
      overflow-x:auto;
      padding-bottom:10px;
    }

    .recommend-card{
      min-width:250px;
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 5px 20px rgba(0,0,0,.08);
    }

    .recommend-card img{
      width:100%;
      height:300px;
      object-fit:cover;
    }

    .recommend-info{
      padding:18px;
    }

    .recommend-info h3{
      margin-bottom:10px;
    }

    .recommend-info p{
      color:#d49a96;
      font-weight:600;
    }

    .cart-popup{

      position:fixed;
      right:30px;
      bottom:30px;
      background:black;
      color:white;
      padding:18px 25px;
      border-radius:15px;

      opacity:0;
      pointer-events:none;

      transition:.4s;

    }

    .cart-popup.show{
      opacity:1;
    }

    @media(max-width:900px){

      nav{
        padding:0 25px;
      }

      .product-page{
        padding:120px 25px 50px;
      }

      .product-details h1{
        font-size:42px;
        line-height:48px;
      }

      .recommend-section{
        padding:0 25px 50px;
      }

    }

  </style>
</head>
<body>

  <nav>

    <div class="logo">
      VELORA
    </div>

  </nav>

  <section class="product-page">

    <div class="product-image">

      <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=300">

    </div>

    <div class="product-details">

      <h1>
        Pastel Love Hoodie
      </h1>

      <div class="price">
        ₹1,999
      </div>

      <p class="desc">

        Premium oversized hoodie designed for modern couples. Soft fabric, aesthetic vibe and perfect comfort for every season.

      </p>

      <div class="sizes">

        <button class="size-btn">S</button>
        <button class="size-btn">M</button>
        <button class="size-btn">L</button>
        <button class="size-btn">XL</button>

      </div>

      <button class="add-cart"
      onclick="addToCart()">

        ADD TO CART

      </button>

    </div>

  </section>

  <section class="recommend-section">

    <h2>
      You May Also Like ❤️
    </h2>

    <div class="recommend-products">

      <div class="recommend-card">

        <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1000&auto=format&fit=crop">

        <div class="recommend-info">

          <h3>Classic Couple Hoodie</h3>

          <p>₹2,199</p>

        </div>

      </div>

      <div class="recommend-card">

        <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=1000&auto=format&fit=crop">

        <div class="recommend-info">

          <h3>Beige Streetwear Set</h3>

          <p>₹2,499</p>

        </div>

      </div>

    </div>

  </section>

  <div class="cart-popup" id="popup">

    Added To Cart ❤️

  </div>

  <script>

function addToCart(){

  let cart =
  JSON.parse(localStorage.getItem("veloraCart")) || [];

  let product = {

    name:"Pastel Love Hoodie ",

    price:1999,

    image:"https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=300",

    gender:"female"

  };

  cart.push(product);

  localStorage.setItem(
    "veloraCart",
    JSON.stringify(cart)
  );

  let popup =
  document.getElementById("popup");

  popup.classList.add("show");

  popup.innerHTML =
  "Added To Cart ❤️";

  setTimeout(()=>{

    popup.classList.remove("show");

  },2000);

}

  </script>

</body>
</html>
